<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Spirit level — balance, equilibrium, emotional check -->
  <g fill="none" stroke="#00C9A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer capsule / housing -->
    <rect x="12" y="36" width="76" height="28" rx="14" ry="14"/>
    <!-- Inner vial (where the bubble sits) -->
    <rect x="26" y="42" width="48" height="16" rx="8" ry="8" stroke-width="1.5"/>
    <!-- Center graduation marks -->
    <line x1="50" y1="38" x2="50" y2="42" stroke-width="1.5"/>
    <line x1="50" y1="58" x2="50" y2="62" stroke-width="1.5"/>
    <!-- Side graduation marks -->
    <line x1="40" y1="39" x2="40" y2="42" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="60" y1="39" x2="60" y2="42" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="40" y1="58" x2="40" y2="61" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="60" y1="58" x2="60" y2="61" stroke-width="1" stroke-opacity="0.5"/>
    <!-- The bubble — centered = level-headed -->
    <ellipse cx="50" cy="50" rx="7" ry="5" fill="#00C9A7" stroke="none" opacity="0.3"/>
    <ellipse cx="50" cy="50" rx="7" ry="5" stroke-width="1.5"/>
    <!-- Small highlight on bubble -->
    <ellipse cx="47" cy="48" rx="2.5" ry="1.5" fill="#00C9A7" stroke="none" opacity="0.25"/>
  </g>
</svg>
