<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Reflective eye — observation, review, seeing clearly -->
  <g fill="none" stroke="#00C9A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper lid arc -->
    <path d="M 12,50 Q 50,18 88,50"/>
    <!-- Lower lid arc -->
    <path d="M 12,50 Q 50,82 88,50"/>
    <!-- Iris circle -->
    <circle cx="50" cy="50" r="14"/>
    <!-- Inner iris detail -->
    <circle cx="50" cy="50" r="7" stroke-width="1.5"/>
    <!-- Pupil -->
    <circle cx="50" cy="50" r="3" fill="#00C9A7" stroke="none"/>
    <!-- Subtle reflection mark -->
    <circle cx="45" cy="45" r="1.5" fill="#00C9A7" stroke="none" opacity="0.4"/>
    <!-- Seven subtle lash marks across the top — one for each day -->
    <line x1="26" y1="38" x2="27" y2="33" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="34" y1="32" x2="35.5" y2="27" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="42" y1="28" x2="44" y2="23" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="50" y1="26" x2="50" y2="21" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="58" y1="28" x2="56" y2="23" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="66" y1="32" x2="64.5" y2="27" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="74" y1="38" x2="73" y2="33" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>
