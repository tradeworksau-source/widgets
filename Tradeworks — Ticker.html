<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks — Ticker</title>
<style>
  :root{
    --bg:#191919;
    --fg:#e8e8e6;
    --border:rgba(232,232,230,.14);
  }
  [data-theme="light"]{
    --bg:#ffffff;
    --fg:#191919;
    --border:rgba(25,25,25,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);overflow:hidden;transition:background .15s ease}
  .wrap{position:relative;height:100%;display:flex;align-items:center}
  .tv{flex:1;min-width:0;height:100%}
  .tradingview-widget-container{height:100%}
  #toggle{
    position:absolute;top:50%;right:8px;transform:translateY(-50%);
    z-index:5;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--border);background:var(--bg);color:var(--fg);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    opacity:.7;transition:opacity .15s ease,background .15s ease
  }
  #toggle:hover{opacity:1}
  #toggle:focus-visible{outline:2px solid #00C9A7;outline-offset:2px}
  #toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){
    body,#toggle{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tv" id="tv"></div>
  <button id="toggle" type="button" aria-label="Switch light/dark theme" title="Switch theme"></button>
</div>
<script>
(function(){
  // Shared key: every Tradeworks widget on this origin follows one theme choice.
  var KEY='tw-theme';
  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var btn=document.getElementById('toggle');
  var media=window.matchMedia('(prefers-color-scheme: light)');

  function saved(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function store(t){try{localStorage.setItem(KEY,t)}catch(e){}}
  function current(){var s=saved();if(s==='light'||s==='dark')return s;return media.matches?'light':'dark'}

  function render(theme){
    document.documentElement.setAttribute('data-theme',theme);
    btn.innerHTML = theme==='dark' ? SUN : MOON; // icon shows what you switch to
    var host=document.getElementById('tv');
    host.innerHTML='';
    var c=document.createElement('div');
    c.className='tradingview-widget-container';
    var w=document.createElement('div');
    w.className='tradingview-widget-container__widget';
    c.appendChild(w);
    var s=document.createElement('script');
    s.type='text/javascript';
    s.src='https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
    s.async=true;
    s.text=JSON.stringify({
      symbols:[
        {proName:'OANDA:XAUUSD',  title:'XAUUSD'},
        {proName:'OANDA:NAS100USD',title:'NAS100'},
        {proName:'OANDA:EURUSD',  title:'EURUSD'},
        {proName:'OANDA:GBPUSD',  title:'GBPUSD'},
        {proName:'OANDA:SPX500USD',title:'US500'}
      ],
      showSymbolLogo:false,
      isTransparent:true,
      displayMode:'regular',
      colorTheme:theme,
      locale:'en'
    });
    c.appendChild(s);
    host.appendChild(c);
  }

  btn.addEventListener('click',function(){
    var next = current()==='dark' ? 'light' : 'dark';
    store(next);
    render(next);
  });

  // If the buyer never touched the toggle, follow their OS/browser preference live.
  if (media.addEventListener){
    media.addEventListener('change',function(){ if(!saved()) render(current()); });
  }

  render(current());
})();
</script>
</body>
</html>
