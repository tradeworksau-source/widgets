<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- HUD targeting frame — command center, control, overview -->
  <g fill="none" stroke="#4a9eca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corner brackets -->
    <polyline points="18,30 18,18 30,18"/>
    <polyline points="70,18 82,18 82,30"/>
    <polyline points="82,70 82,82 70,82"/>
    <polyline points="30,82 18,82 18,70"/>
    <!-- Center diamond -->
    <polygon points="50,33 62,50 50,67 38,50"/>
    <!-- Inner precision dot -->
    <circle cx="50" cy="50" r="2.5" fill="#4a9eca" stroke="none"/>
    <!-- Small tick marks inside brackets -->
    <line x1="34" y1="18" x2="38" y2="18" stroke-width="1.5"/>
    <line x1="82" y1="34" x2="82" y2="38" stroke-width="1.5"/>
    <line x1="66" y1="82" x2="62" y2="82" stroke-width="1.5"/>
    <line x1="18" y1="66" x2="18" y2="62" stroke-width="1.5"/>
  </g>
</svg>
