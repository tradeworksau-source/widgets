<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks PRO — Live Ticker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#191919;overflow:hidden;height:64px;display:flex;align-items:center}

.ticker-wrap{width:100%;overflow:hidden;position:relative;height:64px;display:flex;align-items:center}

.ticker-wrap::before{content:'';position:absolute;left:0;top:0;width:60px;height:100%;background:linear-gradient(90deg,#191919,transparent);z-index:2}
.ticker-wrap::after{content:'';position:absolute;right:0;top:0;width:60px;height:100%;background:linear-gradient(270deg,#191919,transparent);z-index:2}

.brand{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;padding:0 14px;z-index:3;background:#191919}
.brand-text{font-size:10px;font-weight:500;color:#00C9A7;text-transform:uppercase;letter-spacing:.12em;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;white-space:nowrap}
.brand-dot{width:5px;height:5px;border-radius:50%;background:#00C9A7;margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.ticker-track{display:flex;animation:scroll 35s linear infinite;gap:0}
.ticker-track:hover{animation-play-state:paused}

.ticker-item{display:flex;align-items:center;gap:10px;padding:0 24px;border-right:0.5px solid #2a2a2a;height:64px;white-space:nowrap;cursor:default;transition:background .2s}
.ticker-item:hover{background:#1e1e1e}

.item-symbol{font-size:12px;font-weight:500;color:#9a9a98;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-width:52px}
.item-price{font-size:14px;font-weight:500;color:#e8e8e6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;min-width:70px}
.item-change{font-size:11px;font-weight:500;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;min-width:52px}
.item-change.up{color:#00C9A7}
.item-change.down{color:#E24B4A}
.item-arrow{font-size:10px}

@keyframes scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}
</style>
</head>
<body>
<div class="ticker-wrap">
  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-text">Live</div>
  </div>
  <div class="ticker-track" id="ticker" style="padding-left:100px"></div>
</div>

<script>
const instruments = [
  {symbol:'EUR/USD', base:1.0842, decimals:4, pip:0.0001},
  {symbol:'GBP/USD', base:1.2741, decimals:4, pip:0.0001},
  {symbol:'USD/JPY', base:157.42, decimals:2, pip:0.01},
  {symbol:'AUD/USD', base:0.6521, decimals:4, pip:0.0001},
  {symbol:'USD/CAD', base:1.3687, decimals:4, pip:0.0001},
  {symbol:'EUR/GBP', base:0.8512, decimals:4, pip:0.0001},
  {symbol:'NZD/USD', base:0.5982, decimals:4, pip:0.0001},
  {symbol:'EUR/JPY', base:170.84, decimals:2, pip:0.01},
  {symbol:'XAU/USD', base:2318.50, decimals:2, pip:0.1},
  {symbol:'XAG/USD', base:29.42, decimals:2, pip:0.01},
  {symbol:'NAS100', base:19842, decimals:0, pip:1},
  {symbol:'US500',  base:5432, decimals:0, pip:1},
  {symbol:'US30',   base:42150, decimals:0, pip:1},
  {symbol:'UK100',  base:8420, decimals:0, pip:1},
  {symbol:'OIL',    base:78.42, decimals:2, pip:0.01},
  {symbol:'BTC/USD',base:67420, decimals:0, pip:1},
];

let prices = instruments.map(i => ({
  ...i,
  price: i.base,
  change: (Math.random() * 0.8 - 0.4),
  direction: Math.random() > 0.5 ? 1 : -1,
}));

function fmt(price, decimals){
  return price.toFixed(decimals);
}

function fmtChange(change, decimals){
  const sign = change >= 0 ? '+' : '';
  return sign + change.toFixed(decimals);
}

function fmtPct(pct){
  const sign = pct >= 0 ? '+' : '';
  return sign + pct.toFixed(2) + '%';
}

function renderTicker(){
  const track = document.getElementById('ticker');
  const items = [...prices, ...prices];
  track.innerHTML = items.map(p => {
    const cls = p.change >= 0 ? 'up' : 'down';
    const arrow = p.change >= 0 ? '▲' : '▼';
    const pct = (p.change / p.base) * 100;
    return `
      <div class="ticker-item">
        <span class="item-symbol">${p.symbol}</span>
        <span class="item-price">${fmt(p.price, p.decimals)}</span>
        <span class="item-change ${cls}"><span class="item-arrow">${arrow}</span> ${fmtPct(pct)}</span>
      </div>
    `;
  }).join('');
}

function updatePrices(){
  prices = prices.map(p => {
    const move = (Math.random() - 0.48) * p.pip * 3;
    const newPrice = Math.max(p.base * 0.95, Math.min(p.base * 1.05, p.price + move));
    const change = newPrice - p.base;
    return {...p, price: newPrice, change};
  });
  renderTicker();
}

renderTicker();
setInterval(updatePrices, 3000);
</script>
</body>
</html>
