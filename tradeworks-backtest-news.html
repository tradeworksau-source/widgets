<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks PRO — Backtest News Lookup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#191919;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;color:#e8e8e6}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.brand{font-size:11px;font-weight:500;color:#00C9A7;text-transform:uppercase;letter-spacing:.1em}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input[type="date"],select{background:#242424;border:0.5px solid #333;color:#e8e8e6;font-size:12px;padding:7px 10px;border-radius:6px;cursor:pointer;outline:none;transition:border-color .2s}
input[type="date"]:focus,select:focus{border-color:#00C9A7}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.5}
.search-btn{background:#00C9A7;border:none;color:#191919;font-size:12px;font-weight:600;padding:7px 16px;border-radius:6px;cursor:pointer;transition:opacity .2s}
.search-btn:hover{opacity:0.85}
.results{margin-top:12px}
.day-header{font-size:13px;font-weight:500;color:#e8e8e6;margin-bottom:10px;padding-bottom:8px;border-bottom:0.5px solid #2a2a2a;display:flex;align-items:center;gap:8px}
.day-date{font-size:11px;color:#6b6b6b}
.event-row{background:#242424;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px;border-left:3px solid transparent;transition:border-color .2s}
.event-row:hover{border-left-color:#333}
.event-row.red{border-left-color:#E24B4A}
.event-row.orange{border-left-color:#EF9F27}
.impact-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-red{background:#E24B4A}
.dot-orange{background:#EF9F27}
.event-time{font-size:12px;font-weight:500;color:#e8e8e6;min-width:52px;font-variant-numeric:tabular-nums}
.event-name{font-size:12px;color:#9a9a98;flex:1}
.event-currency{font-size:10px;color:#6b6b6b;background:#2a2a2a;padding:2px 7px;border-radius:3px;flex-shrink:0}
.event-impact{font-size:10px;font-weight:500;padding:2px 7px;border-radius:3px;flex-shrink:0}
.impact-red{background:#2e0a0a;color:#E24B4A}
.impact-orange{background:#2e1800;color:#EF9F27}
.empty{text-align:center;padding:30px;color:#555;font-size:12px}
.legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#6b6b6b}
.legend-dot{width:8px;height:8px;border-radius:50%}
.footer{text-align:center;margin-top:12px;font-size:10px;color:#333}
.no-results{background:#242424;border-radius:10px;padding:20px;text-align:center;color:#555;font-size:12px}
</style>
</head>
<body>

<div class="header">
  <div class="brand">⬛ Tradeworks PRO — Backtest News</div>
</div>

<div class="controls">
  <input type="date" id="dateInput">
  <select id="tz">
    <option value="Australia/Sydney">Sydney (AEST)</option>
    <option value="Australia/Melbourne">Melbourne (AEST)</option>
    <option value="Asia/Singapore">Singapore (SGT)</option>
    <option value="Asia/Tokyo">Tokyo (JST)</option>
    <option value="Asia/Dubai">Dubai (GST)</option>
    <option value="Europe/London">London (GMT/BST)</option>
    <option value="Europe/Paris">Paris (CET/CEST)</option>
    <option value="America/New_York">New York (EST/EDT)</option>
    <option value="America/Chicago">Chicago (CST/CDT)</option>
    <option value="America/Los_Angeles">Los Angeles (PST/PDT)</option>
  </select>
  <button class="search-btn" onclick="lookup()">Show news</button>
</div>

<div class="results" id="results"></div>
<div class="footer">Tradeworks PRO · Historical news times shown in selected timezone · High & medium impact only</div>

<script>
// Comprehensive weekly recurring news events (UTC)
// Keyed by day of week (0=Sun,1=Mon...6=Sat) with typical UTC times
// Real backtest tool would use a live API — this covers the most common recurring events

const RECURRING = {
  1: [ // Monday
    {utcH:0,  utcM:1,  name:'JPY Tankan Index',         cur:'JPY', impact:'orange', freq:'monthly'},
    {utcH:7,  utcM:0,  name:'EUR Sentix Investor Confidence', cur:'EUR', impact:'orange', freq:'weekly'},
    {utcH:14, utcM:0,  name:'USD ISM Manufacturing PMI', cur:'USD', impact:'red',    freq:'monthly'},
    {utcH:14, utcM:0,  name:'USD Construction Spending', cur:'USD', impact:'orange', freq:'monthly'},
  ],
  2: [ // Tuesday
    {utcH:0,  utcM:30, name:'AUD RBA Interest Rate Decision', cur:'AUD', impact:'red',    freq:'monthly'},
    {utcH:1,  utcM:30, name:'AUD RBA Rate Statement',   cur:'AUD', impact:'red',    freq:'monthly'},
    {utcH:8,  utcM:55, name:'EUR German Employment Change', cur:'EUR', impact:'orange', freq:'monthly'},
    {utcH:9,  utcM:0,  name:'EUR CPI Flash Estimate y/y', cur:'EUR', impact:'red',   freq:'monthly'},
    {utcH:12, utcM:30, name:'USD Core Durable Goods Orders', cur:'USD', impact:'red', freq:'monthly'},
    {utcH:13, utcM:0,  name:'USD CB Consumer Confidence', cur:'USD', impact:'orange', freq:'monthly'},
    {utcH:13, utcM:0,  name:'USD JOLTS Job Openings',    cur:'USD', impact:'orange', freq:'monthly'},
    {utcH:23, utcM:50, name:'JPY Monetary Policy Meeting Minutes', cur:'JPY', impact:'orange', freq:'monthly'},
  ],
  3: [ // Wednesday
    {utcH:0,  utcM:30, name:'AUD CPI q/q',               cur:'AUD', impact:'red',    freq:'quarterly'},
    {utcH:8,  utcM:55, name:'EUR German Services PMI',   cur:'EUR', impact:'orange', freq:'monthly'},
    {utcH:9,  utcM:0,  name:'EUR Services PMI',          cur:'EUR', impact:'orange', freq:'monthly'},
    {utcH:12, utcM:15, name:'USD ADP Non-Farm Employment', cur:'USD', impact:'red',  freq:'monthly'},
    {utcH:13, utcM:30, name:'USD Core PCE Price Index',  cur:'USD', impact:'red',    freq:'monthly'},
    {utcH:14, utcM:0,  name:'USD ISM Services PMI',      cur:'USD', impact:'red',    freq:'monthly'},
    {utcH:14, utcM:30, name:'USD Crude Oil Inventories', cur:'USD', impact:'orange', freq:'weekly'},
    {utcH:18, utcM:0,  name:'USD FOMC Statement',        cur:'USD', impact:'red',    freq:'monthly'},
    {utcH:18, utcM:30, name:'USD FOMC Press Conference', cur:'USD', impact:'red',    freq:'monthly'},
  ],
  4: [ // Thursday
    {utcH:0,  utcM:30, name:'AUD Employment Change',     cur:'AUD', impact:'red',    freq:'monthly'},
    {utcH:7,  utcM:45, name:'EUR ECB Interest Rate Decision', cur:'EUR', impact:'red', freq:'monthly'},
    {utcH:8,  utcM:30, name:'EUR ECB Press Conference',  cur:'EUR', impact:'red',    freq:'monthly'},
    {utcH:12, utcM:0,  name:'GBP BOE Interest Rate Decision', cur:'GBP', impact:'red', freq:'monthly'},
    {utcH:12, utcM:0,  name:'GBP BOE MPC Vote',         cur:'GBP', impact:'red',    freq:'monthly'},
    {utcH:12, utcM:30, name:'USD Initial Jobless Claims', cur:'USD', impact:'orange', freq:'weekly'},
    {utcH:12, utcM:30, name:'USD Core PPI m/m',          cur:'USD', impact:'orange', freq:'monthly'},
    {utcH:12, utcM:30, name:'USD Philly Fed Manufacturing Index', cur:'USD', impact:'orange', freq:'monthly'},
  ],
  5: [ // Friday
    {utcH:1,  utcM:30, name:'JPY Tokyo Core CPI y/y',   cur:'JPY', impact:'orange', freq:'monthly'},
    {utcH:8,  utcM:55, name:'EUR German Final GDP q/q',  cur:'EUR', impact:'orange', freq:'quarterly'},
    {utcH:9,  utcM:0,  name:'EUR Final GDP q/q',         cur:'EUR', impact:'orange', freq:'quarterly'},
    {utcH:9,  utcM:30, name:'GBP GDP m/m',               cur:'GBP', impact:'red',    freq:'monthly'},
    {utcH:12, utcM:30, name:'USD Non-Farm Payrolls',     cur:'USD', impact:'red',    freq:'monthly'},
    {utcH:12, utcM:30, name:'USD Unemployment Rate',     cur:'USD', impact:'red',    freq:'monthly'},
    {utcH:12, utcM:30, name:'USD Average Hourly Earnings m/m', cur:'USD', impact:'orange', freq:'monthly'},
    {utcH:12, utcM:30, name:'CAD Employment Change',     cur:'CAD', impact:'red',    freq:'monthly'},
    {utcH:14, utcM:0,  name:'USD Prelim UoM Consumer Sentiment', cur:'USD', impact:'orange', freq:'monthly'},
    {utcH:14, utcM:0,  name:'USD Core Retail Sales m/m', cur:'USD', impact:'red',   freq:'monthly'},
  ],
};

function pad(n){return String(n).padStart(2,'0')}

function utcToLocal(dateStr, utcH, utcM, tz){
  const [y,m,d] = dateStr.split('-').map(Number);
  const utcDate = new Date(Date.UTC(y, m-1, d, utcH, utcM, 0));
  return utcDate.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false});
}

function lookup(){
  const dateStr = document.getElementById('dateInput').value;
  const tz = document.getElementById('tz').value;
  const results = document.getElementById('results');

  if(!dateStr){
    results.innerHTML = '<div class="no-results">Please select a date first</div>';
    return;
  }

  const [y,m,d] = dateStr.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const dayOfWeek = date.getDay();
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const events = RECURRING[dayOfWeek];

  if(!events || events.length === 0){
    results.innerHTML = `
      <div class="day-header">
        ${dayNames[dayOfWeek]} <span class="day-date">${d} ${monthNames[m-1]} ${y}</span>
      </div>
      <div class="no-results">No high or medium impact events typically scheduled on ${dayNames[dayOfWeek]}s</div>
    `;
    return;
  }

  const sorted = [...events].sort((a,b) => a.utcH*60+a.utcM - (b.utcH*60+b.utcM));

  let html = `
    <div class="day-header">
      ${dayNames[dayOfWeek]} <span class="day-date">${d} ${monthNames[m-1]} ${y}</span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#E24B4A"></div>High impact</div>
      <div class="legend-item"><div class="legend-dot" style="background:#EF9F27"></div>Medium impact</div>
    </div>
  `;

  sorted.forEach(e => {
    const localTime = utcToLocal(dateStr, e.utcH, e.utcM, tz);
    const impactLabel = e.impact === 'red' ? 'High' : 'Medium';
    const impactClass = e.impact === 'red' ? 'impact-red' : 'impact-orange';
    html += `
      <div class="event-row ${e.impact}">
        <div class="impact-dot dot-${e.impact}"></div>
        <div class="event-time">${localTime}</div>
        <div class="event-name">${e.name}</div>
        <div class="event-currency">${e.cur}</div>
        <div class="event-impact ${impactClass}">${impactLabel}</div>
      </div>
    `;
  });

  results.innerHTML = html;
}

// Set default date to today
const today = new Date();
document.getElementById('dateInput').value = today.toISOString().split('T')[0];
lookup();
</script>
</body>
</html>
