<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks — Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191919;--panel:#141414;--line:#262626;
    --teal:#00C9A7;--teal-ink:#00C9A7;--dim-teal:#1e3d38;
    --txt:#e8e8e6;--mut:#7a7a78;--faint:#4a4a48;
  }
  [data-theme="light"]{
    --bg:#ffffff;--panel:#f7f7f5;--line:#e3e3df;
    --teal:#00C9A7;--teal-ink:#00997e;--dim-teal:rgba(0,201,167,.14);
    --txt:#191919;--mut:#6f6f6d;--faint:#a8a8a4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',monospace;padding:14px 16px;transition:background .15s ease,color .15s ease;}
  .row{display:flex;gap:10px;align-items:stretch;}
  .card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;}
  .card.open{border-color:var(--teal-ink);}
  .city{font-size:9px;letter-spacing:.16em;color:var(--mut);}
  .time{font-size:22px;font-weight:500;color:var(--txt);margin:5px 0 7px;letter-spacing:.02em;}
  .pill{display:inline-block;font-size:9px;letter-spacing:.1em;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--mut);}
  .card.open .pill{background:var(--dim-teal);border-color:var(--teal-ink);color:var(--teal-ink);}
  .count{font-size:10px;color:var(--faint);margin-top:6px;min-height:12px;}
  .card.open .count{color:var(--mut);}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .foot .hint{font-size:9px;letter-spacing:.08em;color:var(--faint);}
  .foot a{font-size:10px;letter-spacing:.06em;color:var(--mut);text-decoration:none;}
  .foot a:hover{color:var(--teal-ink);}
  #theme{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:.75;vertical-align:middle;margin-left:10px;transition:opacity .15s ease;}
  #theme:hover{opacity:1;}
  #theme:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  #theme svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  @media (max-width:640px){.row{flex-direction:column;}}
  @media (prefers-reduced-motion: reduce){body,#theme{transition:none;}}
</style>
</head>
<body>
  <div class="row" id="cards"></div>
  <div class="foot">
    <span class="hint">SESSIONS IN THEIR LOCAL TIME · COUNTDOWNS LIVE · WEEKENDS OFF</span>
    <span>
      <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">📅 TODAY ON FOREXFACTORY →</a>
      <button id="theme" type="button" aria-label="Switch light/dark theme" title="Switch theme"></button>
    </span>
  </div>

<script>
/* ——— Theme: shared key so every Tradeworks widget on this origin flips together ——— */
(function(){
  var KEY='tw-theme';
  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var btn=document.getElementById('theme');
  var media=window.matchMedia('(prefers-color-scheme: light)');
  function saved(){try{var s=localStorage.getItem(KEY);return (s==='light'||s==='dark')?s:null}catch(e){return null}}
  function store(t){try{localStorage.setItem(KEY,t)}catch(e){}}
  function current(){return saved()||(media.matches?'light':'dark')}
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    btn.innerHTML=(t==='dark')?SUN:MOON; // icon shows what you switch to
  }
  btn.addEventListener('click',function(){var n=current()==='dark'?'light':'dark';store(n);apply(n);});
  if(media.addEventListener){media.addEventListener('change',function(){if(!saved())apply(current())});}
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY&&(ev.newValue==='light'||ev.newValue==='dark'))apply(ev.newValue);
  });
  apply(current());
})();

/* ——— Sessions: DST-correct timezone math via Intl ——— */
var SESSIONS=[
  {id:'tokyo',  city:'TOKYO',    tz:'Asia/Tokyo',       open:9, close:18},
  {id:'london', city:'LONDON',   tz:'Europe/London',    open:8, close:17},
  {id:'ny',     city:'NEW YORK', tz:'America/New_York', open:8, close:17}
];

var partsFmt={};
function fmt(tz){
  if(!partsFmt[tz])partsFmt[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  return partsFmt[tz];
}
function tzParts(tz,ts){
  var out={};
  fmt(tz).formatToParts(new Date(ts)).forEach(function(p){if(p.type!=='literal')out[p.type]=+p.value;});
  if(out.hour===24)out.hour=0;
  return out; // {year,month,day,hour,minute,second}
}
function tzOffsetMin(tz,ts){
  var p=tzParts(tz,ts);
  var asUTC=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
  return Math.round((asUTC-ts)/60000);
}
function zonedToUtc(tz,y,m,d,h,min){
  var guess=Date.UTC(y,m-1,d,h,min,0);
  var off=tzOffsetMin(tz,guess);
  var utc=guess-off*60000;
  var off2=tzOffsetMin(tz,utc);
  if(off2!==off)utc=guess-off2*60000;
  return utc;
}
function dowInTz(tz,y,m,d){
  // day of week of a calendar date in that tz (0=Sun..6=Sat)
  return new Date(Date.UTC(y,m-1,d,12,0)).getUTCDay(); // calendar-date weekday is tz-independent
}
function addDays(y,m,d,k){
  var t=new Date(Date.UTC(y,m-1,d+k,12,0));
  return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()};
}
function human(mins){
  mins=Math.max(0,Math.round(mins));
  var d=Math.floor(mins/1440),h=Math.floor((mins%1440)/60),m=mins%60;
  if(d>0)return d+'d '+h+'h';
  if(h>0)return h+'h '+m+'m';
  return m+'m';
}
function stateFor(s,now){
  var p=tzParts(s.tz,now);
  // today's window (if a weekday)
  var dow=dowInTz(s.tz,p.year,p.month,p.day);
  if(dow>=1&&dow<=5){
    var o=zonedToUtc(s.tz,p.year,p.month,p.day,s.open,0);
    var c=zonedToUtc(s.tz,p.year,p.month,p.day,s.close,0);
    if(now>=o&&now<c)return {open:true,label:'CLOSES IN '+human((c-now)/60000)};
    if(now<o)return {open:false,label:'OPENS IN '+human((o-now)/60000)};
  }
  // next weekday open
  for(var k=1;k<=8;k++){
    var nd=addDays(p.year,p.month,p.day,k);
    var ndow=dowInTz(s.tz,nd.y,nd.m,nd.d);
    if(ndow>=1&&ndow<=5){
      var no=zonedToUtc(s.tz,nd.y,nd.m,nd.d,s.open,0);
      return {open:false,label:'OPENS IN '+human((no-now)/60000)};
    }
  }
  return {open:false,label:''};
}
function clockStr(tz,now){
  var p=tzParts(tz,now);
  return String(p.hour).padStart(2,'0')+':'+String(p.minute).padStart(2,'0')+':'+String(p.second).padStart(2,'0');
}

var host=document.getElementById('cards');
SESSIONS.forEach(function(s){
  var d=document.createElement('div');
  d.className='card';d.id='card-'+s.id;
  d.innerHTML='<div class="city">'+s.city+' · '+String(s.open).padStart(2,'0')+':00–'+String(s.close).padStart(2,'0')+':00</div>'
    +'<div class="time" id="t-'+s.id+'">--:--:--</div>'
    +'<span class="pill" id="p-'+s.id+'">—</span>'
    +'<div class="count" id="c-'+s.id+'"></div>';
  host.appendChild(d);
});

function tick(){
  var now=Date.now();
  SESSIONS.forEach(function(s){
    document.getElementById('t-'+s.id).textContent=clockStr(s.tz,now);
    var st=stateFor(s,now);
    var card=document.getElementById('card-'+s.id);
    card.className='card'+(st.open?' open':'');
    document.getElementById('p-'+s.id).textContent=st.open?'OPEN':'CLOSED';
    document.getElementById('c-'+s.id).textContent=st.label;
  });
}
tick();
setInterval(tick,1000);
</script>
</body>
</html>
