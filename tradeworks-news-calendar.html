<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks PRO — Economic Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#191919;--bg2:#161616;--border:#252525;
  --text:#e8e8e6;--mid:#b0b0ae;--dim:#7a7a78;--muted:#4a4a48;
  --teal:#00C9A7;--teal-ink:#00C9A7;--red:#E24B4A;
}
[data-theme="light"]{
  --bg:#ffffff;--bg2:#f7f7f5;--border:#e3e3df;
  --text:#191919;--mid:#5b5b59;--dim:#6f6f6d;--muted:#a8a8a4;
  --teal:#00C9A7;--teal-ink:#00997e;--red:#c93a39;
}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);display:flex;flex-direction:column;transition:background .15s ease,color .15s ease}
.header-row{display:flex;align-items:center;padding:0 16px;height:54px;background:var(--bg);border-bottom:0.5px solid var(--border);gap:14px;flex-shrink:0}
.logo-icon{width:32px;height:32px;flex-shrink:0}
.title-block{display:flex;flex-direction:column;gap:2px;min-width:0}
.page-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.3px;white-space:nowrap}
.page-title em{color:var(--teal-ink);font-style:normal}
.page-sub{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--teal);flex-shrink:0;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
#theme{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.75;transition:opacity .15s ease,background .15s ease;flex-shrink:0}
#theme:hover{opacity:1}
#theme:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#theme svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:0.5px solid var(--border);flex-shrink:0}
.note-flag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--red);border:0.5px solid var(--red);border-radius:3px;padding:2px 6px;flex-shrink:0}
.note-text{font-size:11px;color:var(--dim)}
.cal-wrap{flex:1;min-height:0;padding:8px}
.tradingview-widget-container{height:100%;width:100%}
.tradingview-widget-container__widget{height:calc(100% - 24px)}
.tradingview-widget-copyright{font-size:10px;color:var(--muted);text-align:center;padding-top:6px;font-family:'JetBrains Mono',monospace}
.tradingview-widget-copyright a{color:var(--muted);text-decoration:none}
.tradingview-widget-copyright a:hover{color:var(--teal-ink)}
noscript{display:block;padding:24px 16px;color:var(--dim);font-size:12px}
noscript a{color:var(--teal-ink)}
@media (prefers-reduced-motion: reduce){body,#theme{transition:none}.live-dot{animation:none}}
</style>
</head>
<body>

<div class="header-row">
  <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
    <polyline points="30,18 18,18 18,30" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="70,18 82,18 82,30" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="82,70 82,82 70,82" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="30,82 18,82 18,70" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="50,38 62,50 50,62 38,50" stroke="#00C9A7" stroke-width="2" fill="none"/>
    <circle cx="50" cy="50" r="4" fill="#00C9A7"/>
  </svg>
  <div class="title-block">
    <div class="page-title">Tradeworks <em>PRO</em> — Economic calendar</div>
    <div class="page-sub"><div class="live-dot"></div>Live data · shown in your local timezone · auto-updates</div>
  </div>
  <button id="theme" type="button" aria-label="Switch light/dark theme" title="Switch theme"></button>
</div>

<div class="note-bar">
  <div class="note-flag">Rule</div>
  <div class="note-text">No trading during high-impact news. Check this before every session — red rows move markets.</div>
</div>

<div class="cal-wrap">
  <div class="tradingview-widget-container">
    <div id="tv-host" class="tradingview-widget-container__widget"></div>
    <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/economic-calendar/" rel="noopener nofollow" target="_blank">Economic calendar by TradingView</a></div>
  </div>
</div>

<noscript>JavaScript is off, so the live calendar can't load here. Open the <a href="https://www.tradingview.com/economic-calendar/" rel="noopener">TradingView economic calendar</a> directly instead.</noscript>

<script>
(function(){
  // Shared key: every Tradeworks widget on this origin follows one theme choice.
  var KEY='tw-theme';
  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var btn=document.getElementById('theme');
  var media=window.matchMedia('(prefers-color-scheme: light)');

  function saved(){try{var s=localStorage.getItem(KEY);return (s==='light'||s==='dark')?s:null}catch(e){return null}}
  function store(t){try{localStorage.setItem(KEY,t)}catch(e){}}
  function current(){return saved()||(media.matches?'light':'dark')}

  function render(theme){
    document.documentElement.setAttribute('data-theme',theme);
    btn.innerHTML = theme==='dark' ? SUN : MOON; // icon shows what you switch to
    var host=document.getElementById('tv-host');
    host.innerHTML='';
    var s=document.createElement('script');
    s.type='text/javascript';
    s.src='https://s3.tradingview.com/external-embedding/embed-widget-events.js';
    s.async=true;
    s.text=JSON.stringify({
      colorTheme:theme,
      isTransparent:true,
      width:'100%',
      height:'100%',
      locale:'en',
      importanceFilter:'0,1',
      countryFilter:'us,eu,gb,jp,au,nz,ca,ch'
    });
    host.appendChild(s);
  }

  btn.addEventListener('click',function(){
    var next = current()==='dark' ? 'light' : 'dark';
    store(next);
    render(next);
  });

  // If the buyer never touched the toggle, follow their OS/browser preference live.
  if (media.addEventListener){
    media.addEventListener('change',function(){ if(!saved()) render(current()); });
  }
  // Follow any sibling Tradeworks widget's toggle on the same page.
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY&&(ev.newValue==='light'||ev.newValue==='dark'))render(ev.newValue);
  });

  render(current());
})();
</script>
</body>
</html>
