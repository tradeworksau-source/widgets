<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks — Quote</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191919;--line:#262626;--teal:#00C9A7;--teal-ink:#00C9A7;
    --txt:#e8e8e6;--mut:#7a7a78;--faint:#4a4a48;
  }
  [data-theme="light"]{
    --bg:#ffffff;--line:#e3e3df;--teal:#00C9A7;--teal-ink:#00997e;
    --txt:#191919;--mut:#6f6f6d;--faint:#a8a8a4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;padding:18px 22px;transition:background .15s ease,color .15s ease;}
  .wrap{display:flex;align-items:center;gap:16px;max-width:1100px;margin:0 auto;}
  .bar{width:3px;align-self:stretch;background:var(--teal);opacity:.7;border-radius:2px;flex-shrink:0;}
  .q{flex:1;min-width:0;}
  .q .t{font-size:17px;font-style:italic;line-height:1.45;color:var(--txt);}
  .q .a{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--mut);margin-top:7px;}
  .ctl{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .ctl button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.75;transition:opacity .15s ease;}
  .ctl button:hover{opacity:1;color:var(--teal-ink);}
  .ctl button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .ctl svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  @media (prefers-reduced-motion: reduce){body{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" aria-hidden="true"></div>
  <div class="q">
    <div class="t" id="qt">—</div>
    <div class="a" id="qa"></div>
  </div>
  <div class="ctl">
    <button id="next" type="button" aria-label="Show another quote" title="Another one">
      <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <button id="theme" type="button" aria-label="Switch light/dark theme" title="Switch theme"></button>
  </div>
</div>

<script>
/* ——— Theme: shared key so every Tradeworks widget on this origin flips together ——— */
(function(){
  var KEY='tw-theme';
  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var btn=document.getElementById('theme');
  var media=window.matchMedia('(prefers-color-scheme: light)');
  function saved(){try{var s=localStorage.getItem(KEY);return (s==='light'||s==='dark')?s:null}catch(e){return null}}
  function store(t){try{localStorage.setItem(KEY,t)}catch(e){}}
  function current(){return saved()||(media.matches?'light':'dark')}
  function apply(t){document.documentElement.setAttribute('data-theme',t);btn.innerHTML=(t==='dark')?SUN:MOON;}
  btn.addEventListener('click',function(){var n=current()==='dark'?'light':'dark';store(n);apply(n);});
  if(media.addEventListener){media.addEventListener('change',function(){if(!saved())apply(current())});}
  window.addEventListener('storage',function(ev){if(ev.key===KEY&&(ev.newValue==='light'||ev.newValue==='dark'))apply(ev.newValue);});
  apply(current());
})();

var qt=document.getElementById('qt'),qa=document.getElementById('qa');
function show(i){
  var q=Q[((i%Q.length)+Q.length)%Q.length];
  qt.textContent='\u201C'+q[0]+'\u201D';
  qa.textContent=q[1]?('\u2014 '+q[1].toUpperCase()):'\u2014 TRADEWORKS';
}
function dayIndex(){
  var d=new Date();
  var start=Date.UTC(d.getFullYear(),0,0);
  var day=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-start)/86400000);
  return d.getFullYear()*366+day;
}
var idx=dayIndex();
show(idx);
document.getElementById('next').addEventListener('click',function(){idx+=1+Math.floor(Math.random()*7);show(idx);});
