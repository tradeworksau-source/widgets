<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Time rewind — looking back through historical data -->
  <g fill="none" stroke="#00C9A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock face (slightly offset right to make room for rewind arrow) -->
    <circle cx="54" cy="50" r="28"/>
    <!-- Clock hand — hour (pointing to ~10 o'clock) -->
    <line x1="54" y1="50" x2="44" y2="34" stroke-width="2"/>
    <!-- Clock hand — minute (pointing to ~2) -->
    <line x1="54" y1="50" x2="66" y2="38" stroke-width="1.5"/>
    <!-- Center pivot -->
    <circle cx="54" cy="50" r="2" fill="#00C9A7" stroke="none"/>
    <!-- Counter-clockwise rewind arrow wrapping the left side -->
    <path d="M 38,22 A 32,32 0 0,0 22,50" stroke-width="2"/>
    <!-- Arrowhead -->
    <polyline points="30,17 38,22 42,14" stroke-width="1.8"/>
    <!-- Small hour marks -->
    <line x1="54" y1="24" x2="54" y2="28" stroke-width="1.5"/>
    <line x1="54" y1="72" x2="54" y2="76" stroke-width="1.5"/>
    <line x1="28" y1="50" x2="32" y2="50" stroke-width="1.5"/>
    <line x1="76" y1="50" x2="80" y2="50" stroke-width="1.5"/>
  </g>
</svg>
