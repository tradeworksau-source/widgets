<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks PRO — Session Clock</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#191919;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{width:100%;max-width:520px}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{font-size:11px;font-weight:500;color:#00C9A7;text-transform:uppercase;letter-spacing:.1em}
  .tz-select{background:#242424;border:0.5px solid #333;color:#e8e8e6;font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;outline:none;transition:border-color .2s}
  .tz-select:focus{border-color:#00C9A7}
  .clock-card{background:#242424;border:0.5px solid #2a2a2a;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:20px;margin-bottom:12px}
  .clock-face{width:80px;height:80px;border-radius:50%;border:1.5px solid #333;background:#191919;position:relative;flex-shrink:0}
  .tick{position:absolute;width:1px;height:4px;background:#333;top:4px;left:50%;transform-origin:bottom center}
  .clock-center{width:6px;height:6px;border-radius:50%;background:#00C9A7;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4}
  .hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:2px}
  .hour-hand{width:2.5px;height:24px;background:#e8e8e6;margin-left:-1.25px}
  .min-hand{width:1.5px;height:30px;background:#9a9a98;margin-left:-0.75px}
  .sec-hand{width:1px;height:33px;background:#00C9A7;margin-left:-0.5px}
  .clock-info{flex:1}
  .clock-time{font-size:28px;font-weight:500;color:#e8e8e6;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1}
  .clock-ampm{font-size:13px;color:#6b6b6b;margin-left:4px}
  .clock-date{font-size:12px;color:#6b6b6b;margin-top:4px}
  .clock-tz{font-size:11px;color:#00C9A7;margin-top:3px;font-weight:500}
  .sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sbox{background:#242424;border-radius:10px;padding:12px 14px;border:0.5px solid #2a2a2a;transition:border-color .3s}
  .sbox.is-open{border-color:#00C9A7;background:#0d2420}
  .sbox.is-soon{border-color:#EF9F27;background:#1e1800}
  .sname{font-size:10px;font-weight:500;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .stime{font-size:12px;font-weight:500;color:#e8e8e6;font-variant-numeric:tabular-nums}
  .sutc{font-size:10px;color:#444;margin-top:2px}
  .sbadge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:3px;margin-top:6px}
  .badge-open{background:#0a2e2a;color:#00C9A7}
  .badge-soon{background:#2e2200;color:#EF9F27}
  .badge-closed{background:#2a2a2a;color:#555}
  .scd{font-size:10px;color:#555;margin-top:3px}
  .footer{text-align:center;margin-top:10px;font-size:10px;color:#333}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">⬛ Tradeworks PRO</div>
    <select class="tz-select" id="tz">
      <option value="Australia/Sydney">Sydney (AEST)</option>
      <option value="Australia/Melbourne">Melbourne (AEST)</option>
      <option value="Asia/Singapore">Singapore (SGT)</option>
      <option value="Asia/Tokyo">Tokyo (JST)</option>
      <option value="Asia/Dubai">Dubai (GST)</option>
      <option value="Europe/London">London (GMT/BST)</option>
      <option value="Europe/Paris">Paris (CET/CEST)</option>
      <option value="America/New_York">New York (EST/EDT)</option>
      <option value="America/Chicago">Chicago (CST/CDT)</option>
      <option value="America/Los_Angeles">Los Angeles (PST/PDT)</option>
      <option value="America/Toronto">Toronto (EST/EDT)</option>
    </select>
  </div>

  <div class="clock-card">
    <div class="clock-face" id="face">
      <div class="hand hour-hand" id="hh"></div>
      <div class="hand min-hand" id="mh"></div>
      <div class="hand sec-hand" id="sh"></div>
      <div class="clock-center"></div>
    </div>
    <div class="clock-info">
      <div><span class="clock-time" id="ct">--:--:--</span></div>
      <div class="clock-date" id="cd">---</div>
      <div class="clock-tz" id="ctz">Sydney, AEST</div>
    </div>
  </div>

  <div class="sessions">
    <div class="sbox" id="asia-box">
      <div class="sname">Asia / Tokyo</div>
      <div class="stime" id="asia-time">--:-- – --:--</div>
      <div class="sutc">00:00 – 09:00 UTC</div>
      <div class="sbadge badge-closed" id="asia-badge">Closed</div>
      <div class="scd" id="asia-cd"></div>
    </div>
    <div class="sbox" id="lon-box">
      <div class="sname">London</div>
      <div class="stime" id="lon-time">--:-- – --:--</div>
      <div class="sutc">07:00 – 16:00 UTC</div>
      <div class="sbadge badge-closed" id="lon-badge">Closed</div>
      <div class="scd" id="lon-cd"></div>
    </div>
    <div class="sbox" id="ny-box">
      <div class="sname">New York</div>
      <div class="stime" id="ny-time">--:-- – --:--</div>
      <div class="sutc">12:00 – 21:00 UTC</div>
      <div class="sbadge badge-closed" id="ny-badge">Closed</div>
      <div class="scd" id="ny-cd"></div>
    </div>
  </div>
  <div class="footer">Tradeworks PRO · Market sessions in local time</div>
</div>

<script>
const tzLabels={
  'Australia/Sydney':'Sydney, AEST',
  'Australia/Melbourne':'Melbourne, AEST',
  'Asia/Singapore':'Singapore, SGT',
  'Asia/Tokyo':'Tokyo, JST',
  'Asia/Dubai':'Dubai, GST',
  'Europe/London':'London, GMT/BST',
  'Europe/Paris':'Paris, CET/CEST',
  'America/New_York':'New York, EST/EDT',
  'America/Chicago':'Chicago, CST/CDT',
  'America/Los_Angeles':'Los Angeles, PST/PDT',
  'America/Toronto':'Toronto, EST/EDT'
};

const sessions=[
  {key:'asia',utcO:0,utcC:9},
  {key:'lon',utcO:7,utcC:16},
  {key:'ny',utcO:12,utcC:21}
];

function pad(n){return String(n).padStart(2,'0')}

function utcToLocal(utcHour,tz){
  const now=new Date();
  const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),utcHour,0,0));
  return d.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false});
}

function getLocalParts(tz){
  const now=new Date();
  const t=now.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const dt=now.toLocaleDateString('en-GB',{timeZone:tz,weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const h=parseInt(now.toLocaleString('en-US',{timeZone:tz,hour:'numeric',hour12:false}));
  const m=parseInt(now.toLocaleString('en-US',{timeZone:tz,minute:'2-digit'}));
  const s=parseInt(now.toLocaleString('en-US',{timeZone:tz,second:'2-digit'}));
  return{t,dt,h,m,s};
}

function getUTCDecimal(){
  const n=new Date();
  return n.getUTCHours()+(n.getUTCMinutes()/60)+(n.getUTCSeconds()/3600);
}

function sessionState(utcO,utcC){
  const u=getUTCDecimal();
  const open=u>=utcO&&u<utcC;
  const hoursTo=open?(utcC-u):(utcO>u?utcO-u:24-(u-utcO));
  const hh=Math.floor(hoursTo);
  const mm=Math.round((hoursTo-hh)*60);
  const label=open?`Closes in ${hh}h ${pad(mm)}m`:`Opens in ${hh}h ${pad(mm)}m`;
  return{open,soon:!open&&hoursTo<3,label};
}

function update(){
  const tz=document.getElementById('tz').value;
  const{t,dt,h,m,s}=getLocalParts(tz);

  document.getElementById('ct').textContent=t;
  document.getElementById('cd').textContent=dt;
  document.getElementById('ctz').textContent=tzLabels[tz]||tz;

  const hDeg=(h%12)*30+(m*0.5);
  const mDeg=m*6+(s*0.1);
  const sDeg=s*6;
  document.getElementById('hh').style.transform=`rotate(${hDeg}deg)`;
  document.getElementById('mh').style.transform=`rotate(${mDeg}deg)`;
  document.getElementById('sh').style.transform=`rotate(${sDeg}deg)`;

  sessions.forEach(({key,utcO,utcC})=>{
    const openLocal=utcToLocal(utcO,tz);
    const closeLocal=utcToLocal(utcC,tz);
    document.getElementById(`${key}-time`).textContent=`${openLocal} – ${closeLocal}`;

    const{open,soon,label}=sessionState(utcO,utcC);
    const box=document.getElementById(`${key}-box`);
    const badge=document.getElementById(`${key}-badge`);
    const cd=document.getElementById(`${key}-cd`);

    box.className='sbox'+(open?' is-open':soon?' is-soon':'');
    if(open){
      badge.className='sbadge badge-open';
      badge.textContent='Open';
    }else if(soon){
      badge.className='sbadge badge-soon';
      badge.textContent='Soon';
    }else{
      badge.className='sbadge badge-closed';
      badge.textContent='Closed';
    }
    cd.textContent=label;
  });
}

document.getElementById('tz').addEventListener('change',update);
update();
setInterval(update,1000);
</script>
</body>
</html>
