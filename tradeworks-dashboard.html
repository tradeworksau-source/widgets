<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradeworks PRO — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #191919;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e8e8e6;
    padding: 0;
    overflow-x: hidden;
  }

  /* ── Quote bar ── */
  .quote-bar {
    border-bottom: 0.5px solid #242424;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .quote-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #00C9A7;
    flex-shrink: 0;
    animation: pulse 2.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .quote-text {
    font-size: 11px;
    color: #5a5a58;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .quote-author {
    font-size: 10px;
    color: #3a3a38;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ── Nav bar ── */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 16px;
    border-bottom: 0.5px solid #242424;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-bar::-webkit-scrollbar { display: none; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    color: #6b6b6b;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-item:hover { background: #242424; color: #e8e8e6; }
  .nav-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  .nav-divider {
    width: 0.5px;
    height: 16px;
    background: #2a2a2a;
    flex-shrink: 0;
    margin: 0 4px;
  }

  /* ── 3 panel grid ── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: #222;
    border-top: 0.5px solid #242424;
  }

  .panel {
    background: #191919;
    padding: 16px 20px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .panel-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #3a3a38;
    margin-bottom: 8px;
  }

  /* Session clock panel */
  .session-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .session-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .session-name {
    font-size: 11px;
    color: #6b6b6b;
    font-weight: 500;
    min-width: 52px;
  }
  .session-time {
    font-size: 11px;
    color: #9a9a98;
    font-variant-numeric: tabular-nums;
    flex: 1;
    text-align: center;
  }
  .session-badge {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    min-width: 44px;
    text-align: center;
  }
  .badge-open { background: #0d2420; color: #00C9A7; }
  .badge-soon { background: #2e1800; color: #EF9F27; }
  .badge-closed { background: #1e1e1e; color: #444; }

  .clock-time {
    font-size: 22px;
    font-weight: 300;
    color: #e8e8e6;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .clock-date {
    font-size: 10px;
    color: #3a3a38;
    margin-top: 2px;
  }

  /* Tiltmeter panel */
  .tilt-question {
    font-size: 12px;
    color: #9a9a98;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .tilt-options {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tilt-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 5px;
    border: 0.5px solid #2a2a2a;
    cursor: pointer;
    font-size: 11px;
    color: #6b6b6b;
    transition: all 0.15s;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .tilt-opt:hover { border-color: #00C9A7; color: #e8e8e6; }
  .tilt-opt.selected-green { background: #0d2420; border-color: #00C9A7; color: #00C9A7; }
  .tilt-opt.selected-amber { background: #2e1800; border-color: #EF9F27; color: #EF9F27; }
  .tilt-opt.selected-red { background: #2e0a0a; border-color: #E24B4A; color: #E24B4A; }
  .tilt-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .tilt-result {
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .tilt-score-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .tilt-score-num {
    font-size: 32px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
  }
  .tilt-score-label {
    font-size: 10px;
    color: #6b6b6b;
  }
  .tilt-gauge-bg {
    height: 3px;
    background: #2a2a2a;
    border-radius: 2px;
    overflow: hidden;
  }
  .tilt-gauge-fill {
    height: 3px;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .tilt-message {
    font-size: 11px;
    color: #6b6b6b;
    line-height: 1.5;
  }
  .tilt-reset {
    font-size: 10px;
    color: #3a3a38;
    cursor: pointer;
    text-align: right;
    margin-top: 4px;
  }
  .tilt-reset:hover { color: #00C9A7; }

  /* News panel */
  .news-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .news-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 5px;
    background: #1e1e1e;
  }
  .news-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .news-time { font-size: 10px; color: #6b6b6b; font-variant-numeric: tabular-nums; min-width: 38px; }
  .news-name { font-size: 11px; color: #9a9a98; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news-cur { font-size: 9px; color: #444; }

  .news-countdown {
    font-size: 10px;
    color: #3a3a38;
    margin-top: 6px;
  }
  .news-countdown span { color: #EF9F27; font-variant-numeric: tabular-nums; }

  .no-news { font-size: 11px; color: #3a3a38; margin-top: 8px; }
</style>
</head>
<body>

<!-- 3 panels -->
<div class="panels">

  <!-- Panel 1: Session clock -->
  <div class="panel">
    <div class="panel-label">Market Sessions</div>
    <div class="clock-time" id="clock"></div>
    <div class="clock-date" id="clock-date"></div>
    <div class="session-grid" id="sessions" style="margin-top:10px"></div>
  </div>

  <!-- Panel 2: Quick tiltmeter -->
  <div class="panel" style="border-left:0.5px solid #242424;border-right:0.5px solid #242424;">
    <div class="panel-label">Pre-session check</div>
    <div id="tilt-q-wrap">
      <div class="tilt-question">How are you feeling right now?</div>
      <div class="tilt-options">
        <button class="tilt-opt" onclick="quickTilt('green',15)"><div class="tilt-dot" style="background:#00C9A7"></div>Calm and focused</button>
        <button class="tilt-opt" onclick="quickTilt('amber',45)"><div class="tilt-dot" style="background:#EF9F27"></div>A bit off, manageable</button>
        <button class="tilt-opt" onclick="quickTilt('red',80)"><div class="tilt-dot" style="background:#E24B4A"></div>Emotional or distracted</button>
      </div>
    </div>
    <div class="tilt-result" id="tilt-result">
      <div class="tilt-score-row">
        <div class="tilt-score-num" id="tilt-num"></div>
        <div class="tilt-score-label">tilt score</div>
      </div>
      <div class="tilt-gauge-bg"><div class="tilt-gauge-fill" id="tilt-gauge"></div></div>
      <div class="tilt-message" id="tilt-msg"></div>
      <div class="tilt-reset" onclick="resetTilt()">retake →</div>
    </div>
  </div>

  <!-- Panel 3: News -->
  <div class="panel">
    <div class="panel-label">Today's Key News</div>
    <div class="news-list" id="news-list"></div>
    <div class="news-countdown" id="news-countdown"></div>
  </div>

</div>

<script>
// ── Quotes ──
const QUOTES = [
  {t:"The goal of a successful trader is to make the best trades. Money is secondary.",a:"Alexander Elder"},
  {t:"It's not whether you're right or wrong, but how much you make when right and lose when wrong.",a:"George Soros"},
  {t:"Trade what you see, not what you think.",a:"Anonymous"},
  {t:"The trend is your friend until the end when it bends.",a:"Ed Seykota"},
  {t:"Plan the trade and trade the plan.",a:"Anonymous"},
  {t:"Confidence is not 'I will profit.' Confidence is 'I will be fine if I don't.'",a:"Anonymous"},
  {t:"The market pays you to be disciplined.",a:"Larry Hite"},
  {t:"The hard part isn't finding the trade. It's having the patience to wait for it.",a:"Anonymous"},
  {t:"Protect your capital. Protect your edge. The rest will follow.",a:"Anonymous"},
  {t:"Amateurs go broke taking large losses. Professionals go broke taking small profits.",a:"William Eckhardt"},
  {t:"Do more of what works and less of what doesn't.",a:"Steve Clark"},
  {t:"Losses are the tuition fees you pay to the market.",a:"Anonymous"},
  {t:"Your job is not to predict the market. Your job is to respond to it.",a:"Anonymous"},
  {t:"The elements of good trading: cutting losses, cutting losses, and cutting losses.",a:"Ed Seykota"},
  {t:"Risk comes from not knowing what you're doing.",a:"Warren Buffett"},
];
const q = QUOTES[Math.floor(new Date() / 86400000) % QUOTES.length];
document.getElementById('q-text').textContent = '"' + q.t + '"';
document.getElementById('q-author').textContent = '— ' + q.a;

// ── Clock ──
const TZ = 'Australia/Sydney';
function updateClock(){
  const now = new Date();
  const t = now.toLocaleTimeString('en-AU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const d = now.toLocaleDateString('en-AU',{timeZone:TZ,weekday:'long',day:'numeric',month:'short'});
  document.getElementById('clock').textContent = t;
  document.getElementById('clock-date').textContent = d;
  updateSessions(now);
}

const SESSIONS = [
  {name:'Sydney',  open:22, close:7,  tz:'Australia/Sydney'},
  {name:'London',  open:8,  close:17, tz:'Europe/London'},
  {name:'New York',open:13, close:22, tz:'America/New_York'},
];

function updateSessions(now){
  const html = SESSIONS.map(s => {
    const h = parseInt(now.toLocaleTimeString('en',{timeZone:s.tz,hour:'2-digit',hour12:false}));
    const isOpen = s.open < s.close ? (h>=s.open && h<s.close) : (h>=s.open || h<s.close);
    const isSoon = !isOpen && (s.open < s.close ? (h===s.open-1) : false);
    const badge = isOpen ? '<span class="session-badge badge-open">Open</span>' :
                  isSoon ? '<span class="session-badge badge-soon">Soon</span>' :
                           '<span class="session-badge badge-closed">Closed</span>';
    const localT = now.toLocaleTimeString('en',{timeZone:s.tz,hour:'2-digit',minute:'2-digit',hour12:false});
    return `<div class="session-row"><span class="session-name">${s.name}</span><span class="session-time">${localT}</span>${badge}</div>`;
  }).join('');
  document.getElementById('sessions').innerHTML = html;
}

setInterval(updateClock, 1000);
updateClock();

// ── Quick Tiltmeter ──
function quickTilt(level, score){
  document.getElementById('tilt-q-wrap').style.display = 'none';
  const r = document.getElementById('tilt-result');
  r.style.display = 'flex';
  const colors = {green:'#00C9A7', amber:'#EF9F27', red:'#E24B4A'};
  const msgs = {
    green:'You\'re locked in. Execute your plan and let the setups come to you.',
    amber:'Manageable — stay disciplined. Reduce size and only take A+ setups today.',
    red:'Step away from the platform. Come back when you\'re reset.'
  };
  document.getElementById('tilt-num').textContent = score;
  document.getElementById('tilt-num').style.color = colors[level];
  document.getElementById('tilt-gauge').style.width = score + '%';
  document.getElementById('tilt-gauge').style.background = colors[level];
  document.getElementById('tilt-msg').textContent = msgs[level];
}

function resetTilt(){
  document.getElementById('tilt-q-wrap').style.display = 'block';
  document.getElementById('tilt-result').style.display = 'none';
}

// ── News ──
const TODAY_EVENTS = {
  1:[{t:'14:00',n:'ISM Manufacturing PMI',c:'USD',imp:'red'},{t:'07:00',n:'Sentix Investor Confidence',c:'EUR',imp:'orange'}],
  2:[{t:'09:00',n:'CPI Flash Estimate y/y',c:'EUR',imp:'red'},{t:'12:30',n:'Core Durable Goods',c:'USD',imp:'red'},{t:'13:00',n:'CB Consumer Confidence',c:'USD',imp:'orange'}],
  3:[{t:'12:15',n:'ADP Non-Farm Employment',c:'USD',imp:'red'},{t:'14:00',n:'ISM Services PMI',c:'USD',imp:'red'},{t:'14:30',n:'Crude Oil Inventories',c:'USD',imp:'orange'}],
  4:[{t:'12:00',n:'BOE Interest Rate Decision',c:'GBP',imp:'red'},{t:'12:30',n:'Initial Jobless Claims',c:'USD',imp:'orange'},{t:'07:45',n:'ECB Rate Decision',c:'EUR',imp:'red'}],
  5:[{t:'12:30',n:'Non-Farm Payrolls',c:'USD',imp:'red'},{t:'12:30',n:'Unemployment Rate',c:'USD',imp:'red'},{t:'14:00',n:'Core Retail Sales',c:'USD',imp:'red'}],
  6:[{t:'09:30',n:'GDP m/m',c:'GBP',imp:'red'},{t:'12:30',n:'Average Hourly Earnings',c:'USD',imp:'orange'}],
  0:[],
};

function renderNews(){
  const day = new Date().getDay();
  const events = TODAY_EVENTS[day] || [];
  const colors = {red:'#E24B4A', orange:'#EF9F27'};
  if(!events.length){
    document.getElementById('news-list').innerHTML = '<div class="no-news">No major events today</div>';
    return;
  }
  document.getElementById('news-list').innerHTML = events.slice(0,3).map(e =>
    `<div class="news-item">
      <div class="news-dot" style="background:${colors[e.imp]}"></div>
      <div class="news-time">${e.t}</div>
      <div class="news-name">${e.n}</div>
      <div class="news-cur">${e.c}</div>
    </div>`
  ).join('');

  // Countdown to first event
  const first = events[0];
  const [h,m] = first.t.split(':').map(Number);
  const now = new Date();
  const target = new Date(now);
  target.setHours(h,m,0,0);
  const diff = target - now;
  if(diff > 0){
    const hrs = Math.floor(diff/3600000);
    const mins = Math.floor((diff%3600000)/60000);
    document.getElementById('news-countdown').innerHTML =
      `Next event in <span>${hrs}h ${mins}m</span>`;
  } else {
    document.getElementById('news-countdown').innerHTML = '<span style="color:#E24B4A">News event active</span>';
  }
}

renderNews();
setInterval(renderNews, 60000);
</script>
</body>
