<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Precision crosshair — every trade is a point of execution -->
  <g fill="none" stroke="#00C9A7" stroke-width="2" stroke-linecap="round">
    <!-- Outer scope ring -->
    <circle cx="50" cy="50" r="28"/>
    <!-- Inner ring -->
    <circle cx="50" cy="50" r="12" stroke-width="1.5"/>
    <!-- Crosshair — vertical -->
    <line x1="50" y1="14" x2="50" y2="34"/>
    <line x1="50" y1="66" x2="50" y2="86"/>
    <!-- Crosshair — horizontal -->
    <line x1="14" y1="50" x2="34" y2="50"/>
    <line x1="66" y1="50" x2="86" y2="50"/>
    <!-- Tick marks on outer ring -->
    <line x1="50" y1="18" x2="50" y2="22" stroke-width="1.5"/>
    <line x1="50" y1="78" x2="50" y2="82" stroke-width="1.5"/>
    <line x1="18" y1="50" x2="22" y2="50" stroke-width="1.5"/>
    <line x1="78" y1="50" x2="82" y2="50" stroke-width="1.5"/>
    <!-- Center execution point -->
    <circle cx="50" cy="50" r="2.5" fill="#00C9A7" stroke="none"/>
  </g>
</svg>
